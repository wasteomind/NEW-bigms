<!--
  CTA CALLBACK WIDGET + POPUP — Standalone HTML
  Requires: cta-callback.css, cta-callback.js
  Place before closing </body> tag
  All icons are inline SVG (no dependencies)
-->

<!-- Floating CTA Widget -->
<div class="cta-widget" id="ctaWidget">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
  <span class="cta-widget-text">Перезвоним за 15 минут</span>
</div>

<!-- Callback Popup -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup">
    <button class="popup-close" id="popupClose" aria-label="Закрыть">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="popup-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </div>
    <h2 class="popup-title">Перезвоним за 15 минут</h2>
    <p class="popup-subtitle">Оставьте ваш номер телефона и наш менеджер свяжется с вами в ближайшее время</p>
    <form class="popup-form" id="callbackForm" autocomplete="on">
      <div class="popup-input-wrapper">
        <input
          type="tel"
          class="popup-phone-input"
          id="phoneInput"
          name="phone"
          placeholder="+7 (9__) ___ __-__"
          autocomplete="tel"
          inputmode="numeric"
        />
      </div>
      <button type="submit" class="popup-submit">Заказать звонок</button>
    </form>
    <p class="popup-privacy">Нажимая кнопку, вы соглашаетесь с политикой обработки персональных данных</p>
  </div>
</div>
